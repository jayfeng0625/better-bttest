name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. A push to main gets a
# group of its own, because each commit on main publishes its own images, and
# a group holds at most one pending run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Tests the newest 1.26 patch, the one the golang:1.26 image in the
  # Dockerfile tracks. setup-go takes the runner's cached patch without
  # check-latest. GOTOOLCHAIN=local fails a go.mod go line above 1.26, where
  # go would fetch the newer toolchain and test it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: scripts/check.sh

  # Publishes each image as one linux/amd64 and linux/arm64 index tagged with
  # the commit SHA, and attests the index's build provenance. The base images
  # are pinned by tags that move, so a rebuild of a published commit could
  # change its digest. A rerun skips the build and verifies the attestation.
  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: better-bttest
            target: ''
          - image: better-bttest-init
            target: init
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: published
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "$IMAGE is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$out" != *"$IMAGE: not found"* ]]; then
            echo "$out" >&2
            exit 1
          fi
      - if: steps.published.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.published.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}
          push: true
          # The default provenance attestation adds an unknown/unknown entry
          # per platform to the index, and nothing reads it.
          provenance: false
      # Only the build that pushed the index supplies the digest to sign. The
      # registry tag can move.
      - if: steps.published.outputs.skip != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
      # A rerun fails when the published index has no attestation from this
      # workflow for this commit, such as when the attest step failed after the
      # push. To recover, delete that package version and rerun the job.
      - if: steps.published.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY"
          --source-digest "$GITHUB_SHA"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
