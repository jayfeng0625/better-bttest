name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check.sh

  # Publishes each image as one linux/amd64 and linux/arm64 index tagged with
  # the commit SHA. The base images are pinned by tags that move, so a rebuild
  # of a published commit could change its digest. A rerun skips the build.
  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: better-bttest
            target: ''
          - image: better-bttest-init
            target: init
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: published
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.published.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}
          push: true
          # The default provenance attestation adds an unknown/unknown entry
          # per platform to the index, and nothing reads it.
          provenance: false
